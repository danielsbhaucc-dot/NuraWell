<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תפריט נגישות — הדגמה בערכת NuraWell</title>
<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, sans-serif; color: #EEF8F5; background: radial-gradient(120% 80% at 80% 0%, #145247 0%, #0A2A25 45%, #061815 100%) fixed; }
  main { max-width: 440px; margin: 0 auto; padding: 32px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  h1 { margin: 0; font-size: 1.75rem; }
  p { margin: 0; color: #B9DDD5; line-height: 1.55; }
  .card { background: rgba(14, 42, 37, .72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(238,248,245,.16); border-radius: 20px; padding: 20px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 1rem; }
  input { min-width: 0; width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(238,248,245,.3); background: rgba(6,24,21,.7); color: #EEF8F5; }
  a { color: #8BE9DA; }
  .primary { font: inherit; font-weight: 700; padding: 14px; border-radius: 999px; border: 0; background: #2BB5A3; color: #03201B; cursor: pointer; }
  .bar { position: fixed; inset-inline: 0; bottom: 0; display: flex; justify-content: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(6,24,21,.92); border-top: 1px solid rgba(238,248,245,.14); }
  .bar .primary { width: min(400px, 100%); }
</style>
</head>
<body>
<main id="main" class="a11y-fab-safe">
  <h1>התחברות להמשך המסע</h1>
  <p>דף הדגמה בלבד: טקסט לדוגמה, בלי פרטים אמיתיים. הכפתור העגול בפינה פותח את תפריט הנגישות.</p>
  <form class="card" onsubmit="return false">
    <label>אימייל<input type="email" autocomplete="email" placeholder="name@example.test"></label>
    <label>סיסמה<input type="password" autocomplete="current-password"></label>
    <a href="#forgot">שכחת סיסמה?</a>
  </form>
  <p>משתמש לדוגמה יכול להגדיל טקסט, להחליף לניגודיות גבוהה ולעצור אנימציות. ההגדרות נשמרות במכשיר בלבד.</p>
</main>
<div class="bar"><button type="submit" class="primary" id="login" data-a11y-avoid>כניסה לחשבון</button></div>
<script type="module">
  import { mountA11yWidget, NURAWELL_THEME, findFabOverlaps, fabReserveCss } from './kit/index.js';
  const st = document.createElement('style'); st.textContent = fabReserveCss(); document.head.append(st);
  window.__a11y = mountA11yWidget({ theme: NURAWELL_THEME, fontBase: '/a11y-fonts', statementHref: '/accessibility' });
  window.__overlaps = (o) => findFabOverlaps(document, o);
</script>
</body>
</html>
