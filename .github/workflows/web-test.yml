name: Web tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: ${{ github.workspace }}
      - name: npm audit (catch vulnerable dependencies)
        run: npm audit --audit-level=high
        working-directory: ${{ github.workspace }}
        continue-on-error: true
      - name: Design guard (no white / raw colors / raw buttons)
        run: npm run lint:design
        working-directory: ${{ github.workspace }}/apps/web
      - name: Module system check (metadata, docs index, coupling rules)
        run: node scripts/modules/check.mjs && node scripts/modules/index.mjs --check && node scripts/modules/boundaries.mjs
        working-directory: ${{ github.workspace }}
      - name: Run unit tests
        run: npm run test
        working-directory: ${{ github.workspace }}/apps/web
