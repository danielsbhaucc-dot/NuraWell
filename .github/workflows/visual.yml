name: Visual baselines

# Opt-in to keep Actions minutes low (repo on GitHub Free): runs only when a PR carries the
# `visual` label or on manual dispatch. No build: compares against a deployed URL.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL to compare (default prod)'
        required: false
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  visual:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'visual')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --no-audit --no-fund
        working-directory: ${{ github.workspace }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://nurawell.vercel.app' }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diff
          path: apps/web/test-results
          retention-days: 3
