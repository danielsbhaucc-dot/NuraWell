name: Manual field backfill (scoped)

on:
  workflow_dispatch:
    inputs:
      tables:
        description: 'Comma-separated backfill tables (required)'
        required: true
      action:
        description: 'Optional one-off action (media_receipts_search, receipt_search_parity, iam_audit_reseal, iam_audit_verify); tables is then ignored'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger scoped backfill (counts only)
        env:
          TABLES: ${{ inputs.tables }}
          ACTION: ${{ inputs.action }}
          FIELD_BACKFILL_SECRET: ${{ secrets.FIELD_BACKFILL_SECRET }}
          APP_URL: ${{ secrets.VERCEL_APP_URL }}
        run: |
          [[ "$TABLES" =~ ^[a-z_,]+$ ]] || { echo "bad tables"; exit 1; }
          [[ "$ACTION" =~ ^[a-z_]*$ ]] || { echo "bad action"; exit 1; }
          Q="tables=$TABLES"; [ -n "$ACTION" ] && Q="action=$ACTION"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST -H "Authorization: Bearer $FIELD_BACKFILL_SECRET" -H "Content-Length: 0" "$APP_URL/api/v1/ai/cron/field-backfill?$Q")
          CODE=$(echo "$RESPONSE" | tail -n1)
          echo "$RESPONSE" | head -n-1
          echo "HTTP $CODE"
          [ "$CODE" = "200" ]
