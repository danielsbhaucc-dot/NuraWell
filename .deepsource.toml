version = 1

# הגדרה מפורשת לאנלייזרים שכבר רצים (JavaScript / SQL / Secrets).
# module_system=es-modules: הקוד כולו ESM/TypeScript — בלי זה DeepSource מסמן כל
# פונקציה ברמת-מודול כ-"global scope" (JS-0067) ומכשיל כל PR שנוגע בקובץ.

[[analyzers]]
name = "javascript"

  [analyzers.meta]
  plugins = ["react"]
  environment = ["nodejs", "browser"]
  module_system = "es-modules"
  dialect = "typescript"

[[analyzers]]
name = "sql"

[[analyzers]]
name = "secrets"
