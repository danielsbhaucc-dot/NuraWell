<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--g1:#047857;--g2:#059669;--g3:#10b981;--gold:#d4a24c}
*{box-sizing:border-box}body{margin:0;font-family:Heebo,Rubik,Arial,sans-serif;background:linear-gradient(180deg,#0b2b22,#0f3d30);min-height:100vh;color:#ecfdf5;padding:18px}
.chat{opacity:.55;font-size:13px;margin-bottom:14px}.b{background:#ffffff14;border-radius:16px;padding:10px 12px;margin:6px 0;max-width:80%}
.vault{position:relative;border-radius:26px;padding:20px 18px 18px;background:linear-gradient(160deg,#064e3b,#065f46 55%,#047857);border:1px solid #6ee7b740;box-shadow:0 20px 50px #0008,inset 0 1px 0 #a7f3d055;overflow:hidden}
.vault:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,#34d39933,transparent 30%);animation:spin 7s linear infinite}
.vault>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
.head{display:flex;align-items:center;gap:12px}
.lock{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#34d399,#047857);box-shadow:0 0 0 0 #34d39980;animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 14px #34d39900}100%{box-shadow:0 0 0 0 #34d39900}}
.shackle{transform-origin:70% 100%;transition:transform .5s cubic-bezier(.5,1.8,.5,1)}
.typing .shackle,.idle .shackle{transform:translateY(-3px) rotate(-18deg)}
.sealed .shackle{transform:none}
h3{margin:0;font-size:17px}.sub{font-size:12.5px;color:#a7f3d0;margin-top:2px}
.field{margin-top:16px;border-radius:16px;background:#022c22cc;border:1.5px solid #34d39955;padding:14px;min-height:58px;font:600 18px/1.4 ui-monospace,monospace;letter-spacing:2px;direction:ltr;text-align:right;color:#6ee7b7;transition:border-color .3s}
.typing .field{border-color:#34d399;box-shadow:0 0 0 4px #34d39922}
.ch{display:inline-block;animation:scr .5s steps(6)}
@keyframes scr{0%{color:#fbbf24;transform:translateY(-4px)}100%{transform:none}}
.caret{display:inline-block;width:2px;height:20px;background:#6ee7b7;vertical-align:middle;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.meter{display:flex;gap:6px;margin-top:10px;font-size:11.5px;color:#a7f3d0;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#34d399;animation:pulse 1.6s infinite}
.btn{margin-top:14px;width:100%;border:0;border-radius:16px;padding:14px;font:700 16px Heebo,Arial;color:#064e3b;background:linear-gradient(135deg,#a7f3d0,#34d399);box-shadow:0 8px 20px #10b98155}
.note{font-size:11.5px;color:#a7f3d0cc;margin-top:10px;line-height:1.6}
.ok{display:none;text-align:center;padding:10px 0}
.sealed .form{display:none}.sealed .ok{display:block}
.ring{width:84px;height:84px;margin:6px auto 10px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#10b981,#047857);box-shadow:0 0 30px #34d39988;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}}
.ok b{font-size:17px}.ok p{font-size:12.5px;color:#a7f3d0;margin:6px 0 0}
.chip{display:inline-block;margin-top:10px;font:600 12px monospace;background:#022c22;border:1px solid #34d39966;border-radius:999px;padding:5px 10px;direction:ltr}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="chat"><div class="b">אלמוג: אם תרצה לשמור פרט רגיש (כמו מספר ת"ז לטופס), אפשר כאן בכספת. אני לא רואה אותו.</div></div>
<section class="vault typing" role="region" aria-label="כספת מידע רגיש">
 <div class="head"><div class="lock" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ecfdf5" stroke-width="2.2" stroke-linecap="round"><path class="shackle" d="M7 11V8a5 5 0 0 1 10 0v3"/><rect x="4.5" y="11" width="15" height="10" rx="3" fill="#ecfdf522"/><circle cx="12" cy="16" r="1.4" fill="#ecfdf5"/></svg></div>
 <div><h3>כספת מאובטחת</h3><div class="sub">מוצפן אצלנו • לא נשלח לאלמוג או ל-AI</div></div></div>
 <div class="form">
  <label class="sub" for="v" style="display:block;margin-top:14px">מספר תעודת זהות</label>
  <div class="field" id="v" aria-live="off">••••••<span class="ch">#</span><span class="ch">7</span><span class="caret"></span></div>
  <div class="meter"><span class="dot"></span>מצפין תוך כדי הקלדה…</div>
  <button class="btn">🔐 נעילה בכספת</button>
  <div class="note">רק אתה יכול לראות את הערך. בשיחה הוא יופיע רק כקוד הפניה.</div>
 </div>
 <div class="ok" role="status"><div class="ring"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><b>נשמר ונעול 🔒</b><p>מוצפן ב-AES-256. אלמוג רואה רק את ההפניה:</p><span class="chip">[[VAULT:ת"ז]]</span></div>
</section></body></html>
