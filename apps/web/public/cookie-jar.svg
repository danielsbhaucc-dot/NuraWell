<linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9ecd6" stop-opacity=".3"/><stop offset=".25" stop-color="#fbf6e6" stop-opacity=".45"/><stop offset=".5" stop-color="#cfe6d2" stop-opacity=".3"/><stop offset="1" stop-color="#8fb89a" stop-opacity=".55"/></linearGradient>
<radialGradient id="ck" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#e8b26a"/><stop offset=".7" stop-color="#c4813f"/><stop offset="1" stop-color="#94592a"/></radialGradient>
<linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc95"/><stop offset=".45" stop-color="#d1a24a"/><stop offset="1" stop-color="#8a6224"/></linearGradient>
<radialGradient id="sun" cx=".25" cy=".2" r=".8"><stop offset="0" stop-color="#fff3cc" stop-opacity=".9"/><stop offset="1" stop-color="#fff3cc" stop-opacity="0"/></radialGradient>
